plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // JNA: Windows-only module enumeration to detect OBS's in-process
    // game-capture hook; bundled inside the mod jar (see fetchJna/jar).
    implementation "net.java.dev.jna:jna:5.14.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Download JNA once so it can be bundled (kept out of the source tree).
def jnaVersion = "5.14.0"
def jnaJar = file("$buildDir/jna/jna-${jnaVersion}.jar")
tasks.register("fetchJna") {
    outputs.file(jnaJar)
    doLast {
        if (!jnaJar.exists()) {
            jnaJar.parentFile.mkdirs()
            def url = "https://repo1.maven.org/maven2/net/java/dev/jna/jna/${jnaVersion}/jna-${jnaVersion}.jar"
            new URL(url).withInputStream { input -> jnaJar.withOutputStream { output -> output << input } }
        }
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }

    // Bundle JNA inside the mod jar so the Fabric loader adds it to the
    // classpath at runtime (declared in fabric.mod.json under "jars").
    dependsOn "fetchJna"
    from(jnaJar) { into("") }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
