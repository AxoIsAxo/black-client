name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract commit info
        id: commit_info
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "subject=$SUBJECT" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: kineticclient-${{ steps.commit_info.outputs.short_sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

      - name: Update 'latest' Git Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push origin -f latest

      - name: Create Release (Commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit_info.outputs.short_sha }}
          name: "${{ steps.commit_info.outputs.short_sha }}"
          body: |
            ### ⚡ Kinetic Client — `${{ steps.commit_info.outputs.short_sha }}`
            - **Commit Message**: ${{ steps.commit_info.outputs.subject }}
            - **Full SHA**: `${{ github.sha }}`
            - **CI Run**: [#${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Branch**: `${{ github.ref_name }}`
            
            Built with Fabric Loom for Minecraft 1.20+ / 1.21.1.
          draft: false
          prerelease: false
          make_latest: "false"
          generate_release_notes: true
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release (Latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest"
          body: |
            ### ⚡ Kinetic Client (Latest Build)
            - **Latest Commit**: `${{ steps.commit_info.outputs.short_sha }}` — ${{ steps.commit_info.outputs.subject }}
            - **Full Commit**: `${{ github.sha }}`
            - **CI Run**: [#${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Always points to the latest build on `main`.
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          token: ${{ secrets.GITHUB_TOKEN }}
